" font-weight="600">9%</text><rect x="749.6" y="152.0" width="60.4" height="20.0" rx="0" fill="#eda100"/><text x="779.8" y="166.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#fcfcfb" text-anchor="middle" font-weight="600">12%</text><text x="818.0" y="166.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8a8a84" text-anchor="start" font-weight="400">n=241</text><text x="278.0" y="212.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#52514e" text-anchor="end" font-weight="400">sonnet: propose_batch policy</text><rect x="290.0" y="198.0" width="260.0" height="20.0" rx="0" fill="#2a78d6"/><text x="420.0" y="212.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#fcfcfb" text-anchor="middle" font-weight="600">50%</text><rect x="550.0" y="198.0" width="260.0" height="20.0" rx="0" fill="#eb6834"/><text x="680.0" y="212.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#fcfcfb" text-anchor="middle" font-weight="600">50%</text><text x="818.0" y="212.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8a8a84" text-anchor="start" font-weight="400">n=18</text><line x1="24.0" y1="246.0" x2="856.0" y2="246.0" stroke="#e6e5e1" stroke-width="1" /><text x="278.0" y="268.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#52514e" text-anchor="end" font-weight="400">condition C: fit_custom_model scaling</text><rect x="290.0" y="254.0" width="514.0" height="20.0" rx="0" fill="#2a78d6"/><text x="547.0" y="268.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#fcfcfb" text-anchor="middle" font-weight="600">99%</text><rect x="804.0" y="254.0" width="6.0" height="20.0" rx="0" fill="#1baf7a"/><text x="818.0" y="268.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8a8a84" text-anchor="start" font-weight="400">n=87</text><text x="24.0" y="328.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8a8a84" text-anchor="start" font-weight="400">In condition C the blue share is the default pool scaling and the green share the purchased scaling, an explicit argument.</text><text x="24.0" y="346.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#8a8a84" text-anchor="start" font-weight="400">Purchased scaling is the best scripted policy on N-dev and the worst on E: agents rarely try it, but always using it would not be right either.</text></svg>
