<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 358" width="880" height="358" role="img" aria-labelledby="t d"><title id="t">Agents take the default</title><desc id="d">Share of propose_batch policies and fit_custom_model scalings chosen, per model.</desc><rect width="880" height="358" fill="#fcfcfb"/><text x="24.0" y="30.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">Agents take the default</text><text x="24.0" y="50.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">Share of calls by the choice made, all agent episodes; n is the number of calls</text><rect x="24.0" y="71.0" width="10.0" height="10.0" rx="2" fill="#2a78d6"/><text x="40.0" y="80.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">learner_sim (the default)</text><rect x="242.0" y="71.0" width="10.0" height="10.0" rx="2" fill="#eb6834"/><text x="258.0" y="80.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">learner</text><rect x="330.4" y="71.0" width="10.0" height="10.0" rx="2" fill="#1baf7a"/><text x="346.4" y="80.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">a purchased variant</text><rect x="505.2" y="71.0" width="10.0" height="10.0" rx="2" fill="#eda100"/><text x="521.2" y="80.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">random or fixed</text><text x="278.0" y="120.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial