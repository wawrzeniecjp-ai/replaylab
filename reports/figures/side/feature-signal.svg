<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 458" width="880" height="458" role="img" aria-labelledby="t d"><title id="t">How informative the predicted scores are</title><desc id="d">AUC of each visible feature for hits, on N-dev and on E.</desc><rect width="880" height="458" fill="#fcfcfb"/><text x="24.0" y="30.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">The predicted scores carry little signal, and almost none on E</text><text x="24.0" y="50.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">AUC of each visible feature for telling hits from non-hits, in its declared good direction, 90% interval (Hanley-McNeil)</text><line x1="381.1" y1="76.0" x2="381.1" y2="408.0" stroke="#e6e5e1" stroke-width="1" /><text x="381.1" y="424.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#8a8a84" text-anchor="middle" font-weight="400">0.4</text><line x1="483.3" y1="76.0" x2="483.3" y2="408.0" stroke="#e6e5e1" stroke-width="1" /><text x="483.3" y="424.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#8a8a84" text-anchor="middle" font-weight="400">0.5</text><line x1="585.6" y1="76.0" x2="585.6" y2="408.0" stroke="#e6e5e1" stroke-width="1" /><text x="585.6" y="424.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#8a8a84" text-anchor="middle" font-weight="400">0.6</text><line x1="687.8" y1="76.0" x2="687.8" y2="408.0" stroke="#e6e5e1" stroke-width="1" /><text x="687.8" y="424.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#8a8a84" text-anchor="middle" font-weight="400">0.7</text><line x1="790.0" y1="76.0" x2="