<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 396" width="760" height="396" role="img" aria-labelledby="t d"><title id="t">The same ladder, two pools: the ranking inverts</title><desc id="d">Mean hits per scripted policy on N-dev and on E, 100 seeds.</desc><rect width="760" height="396" fill="#fcfcfb"/><text x="24.0" y="30.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#0b0b0b" text-anchor="start" font-weight="600">The same ladder, two pools: the ranking inverts</text><text x="24.0" y="50.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">Mean hits of 60 purchases over 100 seeds, from reports/ladder.csv</text><rect x="24" y="62" width="10" height="10" rx="2" fill="#2a78d6"/><text x="40.0" y="71.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">N-dev (Nipah)</text><rect x="234" y="62" width="10" height="10" rx="2" fill="#eb6834"/><text x="250.0" y="71.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">E (EGFR transfer)</text><text x="184.0" y="116.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#52514e" text-anchor="end" font-weight="400">random</text><rect x="196" y="96" width="92.9" height="13" rx="4" fill="#2a78d6"/><text x="296.9" y="107.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">6.0</text><rect x="196" y="113" width="147.7" height="13" rx="4" fill="#eb6834"/><text x="351.7" y="124.0" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#0b0