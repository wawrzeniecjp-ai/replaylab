# Great Docs configuration for replaylab.
# Docs: https://posit-dev.github.io/great-docs/user-guide/configuration.html
# Regenerate a full commented template with: uv run great-docs config

parser: google
# Dynamic introspection fails on this package and falls back to static
# analysis anyway; griffe's source analysis gives the same pages faster.
dynamic: false

# Narrative first, then the reference.
navbar_order:
  - User Guide
  - Reference

# The config lives at the repository root (not inside docs/), so point at the
# guide directory explicitly; path is relative to this file.
user_guide: docs/user_guide

# GitHub integration: navbar widget + "source" links on every API page.
repo: https://github.com/wawrzeniecjp-ai/replaylab
source:
  branch: main

# The package is not published on PyPI (yet): don't link there.
pypi: false

# The reference is grouped by architectural layer, in the order a decision
# travels through the system: types -> config -> data -> storage/lab ->
# engine -> the agent side (advisor/policies) -> evaluation -> tooling.
# This mirrors the repo map in docs/design-notes.md and the import rules
# enforced by tests/test_import_boundaries.py.
reference:
  title: "API Reference"
  desc: >-
    Grouped by layer. The dependency arrows point inward: the advisor and
    policies only ever see a CampaignState snapshot, so they can neither
    write to the store nor peek at outcomes the campaign has not bought.
  sections:
    - title: Domain model
      desc: >-
        Standard-library-only types shared by everything else (enforced by
        a test): what a design, an outcome, a batch and an immutable
        campaign snapshot are, plus the visible feature configuration.
      contents:
        - domain.Design
        - domain.Outcome
        - domain.Batch
        - domain.BatchStatus
        - domain.CampaignConfig
        - domain.CampaignState
        - domain.Mode
        - domain.DesignId
        - domain.FeatureSpec
        - domain.FeatureConfig
        - domain.DEFAULT_FEATURES
        - domain.STRENGTHS
        - domain.feature_names
        - domain.orientation_signs

    - title: Configuration
      desc: >-
        YAML loading and validation for config/features.yaml (which metrics
        an agent may see per target) and config/games.yaml (the games).
        Every validation error raises ConfigError naming the exact place.
      contents:
        - config.GameConfig
        - config.ConfigError
        - config.load_feature_config
        - config.load_games
        - config.parse_feature_config
        - config.parse_games

    - title: Data pipeline
      desc: >-
        Proteinbase CSV -> designs/outcomes/targets tables -> sequence
        clustering and frozen folds -> the pool a game plays on. The pool
        loader is the only code that reads hidden outcomes.
      contents:
        - datasets.proteinbase.Tables
        - datasets.proteinbase.build_all
        - datasets.proteinbase.write_tables
        - datasets.proteinbase.load_raw
        - datasets.proteinbase.validate_raw
        - datasets.proteinbase.build_designs
        - datasets.proteinbase.build_outcomes
        - datasets.proteinbase.build_targets
        - datasets.proteinbase.flatten_evaluations
        - datasets.proteinbase.compare_to_spec
        - datasets.similarity.kmer_matrix
        - datasets.similarity.cosine_similarity_matrix
        - datasets.similarity.cluster_ids
        - datasets.similarity.canonical_labels
        - datasets.similarity.cluster_sizes
        - datasets.similarity.summarize_clusters
        - datasets.similarity.count_boundary_pairs
        - datasets.splits.FoldSelection
        - datasets.splits.NoBalancedSplit
        - datasets.splits.select_folds
        - datasets.splits.assign_folds
        - datasets.splits.fold_counts
        - datasets.splits.is_balanced
        - datasets.split_tables.build_cluster_table
        - datasets.split_tables.build_fold_table
        - datasets.split_tables.write_split_files
        - datasets.split_tables.heldout_ids
        - datasets.split_tables.compare_cluster_summary
        - datasets.aliases.Aliaser
        - datasets.aliases.UnknownIdError
        - datasets.pool.DesignPool
        - datasets.pool.load_pool
        - datasets.pool.load_outcomes
        - datasets.pool.HeldOutAccessError
        - datasets.feature_review.MetricReview
        - datasets.feature_review.review_numeric_metrics
        - datasets.feature_review.review_non_numeric_metrics
        - datasets.feature_review.render_markdown
        - datasets.author_checks.designs_per_author
        - datasets.author_checks.nearest_neighbor_table
        - datasets.author_checks.summarize_author_checks

    - title: Campaign store
      desc: >-
        Durable, transactional SQLite persistence for campaigns: batches
        move only forward (proposed -> submitted -> partial -> complete),
        every mutating method is one transaction, and the event log is what
        makes kill-and-resume possible.
      contents:
        - store.CampaignStore
        - store.Event
        - store.Prediction
        - store.StoreError
        - store.errors.SchemaError
        - store.UnknownCampaign
        - store.UnknownDesign
        - store.InvalidTransition
        - store.OutcomeConflict
        - store.schema.current_version
        - store.schema.migrate

    - title: Lab backends
      desc: >-
        Where outcomes come from. The replay backend serves recorded
        outcomes only after a submission plus its delay; its surface is
        deliberately tiny so there is no bulk accessor to leak through.
      contents:
        - backends.LabBackend
        - backends.ReplayBackend
        - backends.SubmissionHandle
        - backends.PollResult
        - backends.BackendError
        - backends.UnknownDesignError
        - backends.DuplicateSubmissionError

    - title: Engine
      desc: >-
        The rules of the game: rounds are batch slots, submit ticks the
        clock, settle drains pending deliveries, scoring turns a finished
        campaign into a ScoreCard. build_replay_campaign wires a game from
        the processed tables and can resume from the event log.
      contents:
        - engine.Campaign
        - engine.SubmitResult
        - engine.ScoreCard
        - engine.ScoringContext
        - engine.score
        - engine.replay.ReplayEnvironment
        - engine.replay.build_replay_campaign
        - engine.replay.restore_backend
        - engine.EngineError
        - engine.CampaignStopped
        - engine.NoRoundsLeft
        - engine.EmptyBatch
        - engine.BatchTooLarge
        - engine.DuplicateDesigns
        - engine.UnknownDesignError
        - engine.AlreadyPurchased
        - engine.BudgetExceeded
        - engine.NothingPending
        - engine.ScoringError

    - title: Advisor
      desc: >-
        The agent's brain, as pure functions over a CampaignState snapshot:
        preprocessing (orientation applied here, D7), the logistic model
        (fits delivered purchases only), 3-mer similarity to hits, hit-rate
        estimates and the stop rules.
      contents:
        - advisor.preprocess.Preprocessor
        - advisor.model.ModelConfig
        - advisor.model.InsufficientData
        - advisor.model.FittedModel
        - advisor.model.fit_model
        - advisor.similarity.SimilarityIndex
        - advisor.stop.StopVerdict
        - advisor.stop.StopAdvice
        - advisor.stop.stop_advice
        - advisor.stop.low_yield
        - advisor.stop.decay
        - advisor.stop.window_hits_at_boundaries
        - advisor.rates.RateEstimate
        - advisor.rates.GroupEstimate
        - advisor.rates.HitRateReport
        - advisor.rates.estimate_hit_rate
        - advisor.rates.beta_posterior

    - title: Policies
      desc: >-
        The scripted ladder: choose(state, k, rng) -> ids. Every policy
        sees only the snapshot, never buys what it already bought, breaks
        ties by design id, and returns [] to mean "stop".
      contents:
        - policies.Policy
        - policies.RandomPolicy
        - policies.FixedMetric
        - policies.Learner
        - policies.LearnerSim
        - policies.PurchasedLearner
        - policies.PurchasedLearnerSim
        - policies.purchased_scale
        - policies.WithStop
        - policies.make_rng

    - title: Evaluation
      desc: >-
        Offline validation: the ladder plays every policy on every game for
        many seeds and writes reports; the smoke test exercises an
        OpenAI-compatible endpoint's tool-call round trip.
      contents:
        - eval.ladder.run_game
        - eval.ladder.LadderGame
        - eval.ladder.run_ladder
        - eval.ladder.FrozenConfig
        - eval.ladder.load_frozen
        - eval.ladder.summarize
        - eval.ladder.write_reports
        - eval.smoke.run_smoke
        - eval.smoke.SmokeReport
        - eval.smoke.ProbeResult
        - eval.smoke.format_report
        - eval.smoke.passback_needed

    - title: Agent interfaces
      desc: >-
        The 14 tools an agent gets over MCP (stdio), plus the same tools on
        the command line. Every tool is a plain method over one campaign,
        so what an agent sees is what the tool tests check. This is the one
        package allowed to see every layer -- and nothing may import it.
      contents:
        - interfaces.tools.Toolbox
        - interfaces.tools.ToolContext
        - interfaces.tools.ToolFailure
        - interfaces.tools.resolve_tool_selection
        - interfaces.tools.TOOL_DESCRIPTIONS
        - interfaces.runtime.Runtime
        - interfaces.runtime.build_runtime
        - interfaces.runtime.SetupError
        - interfaces.policy_factory.make_policy
        - interfaces.policy_factory.policy_help
        - interfaces.policy_factory.UnknownPolicy
        - interfaces.server.build_server
        - interfaces.server.serve
        - interfaces.server.REGISTERED_TOOLS
        - interfaces.schemas.DescribeCampaign
        - interfaces.schemas.QueryPoolResult
        - interfaces.schemas.SubmitBatchResult
        - interfaces.schemas.ProposeBatchResult
        - interfaces.schemas.FitAndRankResult
        - interfaces.schemas.HitRateResult
        - interfaces.schemas.SimilarDesignsResult
        - interfaces.schemas.CampaignSummaryResult
        - interfaces.schemas.StopAdviceResult
        - interfaces.schemas.History

    - title: OpenAPI spec pin
      desc: >-
        Records the sha256 of the published Adaptyv OpenAPI spec so a later
        change to the live API is detected (prerequisite for the live
        backend phase).
      contents:
        - spec_pin.sha256_file
        - spec_pin.openapi_info
        - spec_pin.write_pin
        - spec_pin.read_pin
        - spec_pin.verify_pin
