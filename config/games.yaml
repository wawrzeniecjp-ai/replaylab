# One entry per game. budget must equal rounds * batch_size.
# split: dev | heldout | all   (dev and heldout need data/splits/folds.csv)
# kind:  rank (default) | stop
version: 1
games:
  N-dev:
    {target: nipah-glycoprotein-g, split: dev, rounds: 4, batch_size: 15, budget: 60}
  N-held:
    {target: nipah-glycoprotein-g, split: heldout, rounds: 4, batch_size: 8, budget: 32}
  E:
    {target: egfr, split: all, rounds: 4, batch_size: 15, budget: 60}
  # Exploratory: the pre-registered longer-horizon E (design-notes section 8).
  # Same target, split and batch size, twice the horizon; excluded from the
  # default ladder, frozen_v1 and every decision rule.
  E-long:
    {target: egfr, split: all, rounds: 8, batch_size: 15, budget: 120, exploratory: true}
  # The Anthropic binder release, one game per target (docs/prereg-anthropic.md).
  # final_test: each is played once, by the runner with --final-run, against
  # --tables data/processed/anthropic. Shape fixed before any hit rate was read: 4 rounds
  # of 8 on a 90-design pool. A batch of 8 is what keeps the scripted fit gate (2 hits,
  # 8 purchases) reachable in round 2; a smaller batch would leave it shut and quietly
  # favour the agent, as it did on E (docs/caveats.md entry 3).
  # Nipah-G and EGFR are Proteinbase's two targets under a different design campaign;
  # BBF-14 and BHRF1 are targets Proteinbase does not have, so a result on the first two
  # cannot be explained by target familiarity alone.
  AB-nipah:
    {target: ab-nipah-g, split: all, rounds: 4, batch_size: 8, budget: 32, final_test: true}
  AB-egfr:
    {target: ab-egfr, split: all, rounds: 4, batch_size: 8, budget: 32, final_test: true}
  AB-bbf14:
    {target: ab-bbf-14, split: all, rounds: 4, batch_size: 8, budget: 32, final_test: true}
  AB-bhrf1:
    {target: ab-bhrf1, split: all, rounds: 4, batch_size: 8, budget: 32, final_test: true}
  # The rehearsal: the same shape on a copy with shuffled feature names and drawn labels
  # (scripts/build_anthropic.py --rehearsal). Its own target id, which the real tables do
  # not contain, so this game cannot be pointed at them.
  AB-rehearsal:
    {target: ab-rehearsal, split: all, rounds: 4, batch_size: 8, budget: 32}
  N-dev-delay2:
    {target: nipah-glycoprotein-g, split: dev, rounds: 6, batch_size: 10, budget: 60, delay_rounds: 2}
  S-human-serum-albumin:
    {target: human-serum-albumin, split: all, rounds: 6, batch_size: 5, budget: 30, kind: stop}
  S-human-tnfa:
    {target: human-tnfa, split: all, rounds: 6, batch_size: 5, budget: 30, kind: stop}
  S-human-gm2a:
    {target: human-gm2a, split: all, rounds: 6, batch_size: 5, budget: 30, kind: stop}
  S-human-orm2:
    {target: human-orm2, split: all, rounds: 6, batch_size: 5, budget: 30, kind: stop}
  S-human-rfk:
    {target: human-rfk, split: all, rounds: 6, batch_size: 5, budget: 30, kind: stop}
  S-hnmt:
    {target: hnmt, split: all, rounds: 6, batch_size: 5, budget: 30, kind: stop}
  S-human-ambp:
    {target: human-ambp, split: all, rounds: 6, batch_size: 5, budget: 30, kind: stop}
  S-human-idi2:
    {target: human-idi2, split: all, rounds: 6, batch_size: 5, budget: 30, kind: stop}
