# Visible computational features per target, and the pre-registered first column.
# Sequence length and design_class are always visible and are not listed here.
# REVIEWED 2026-10-13 (task T02): all seven features pass the review rules in
# notes/week0/feature_review.md (coverage >= 0.99, no missingness leak), so the
# pre-registered list is unchanged. Metrics that also pass but were not added
# (boltz2_pdockq, boltz2_lis, boltz2_ptm, boltz2_complex_*, ted_confidence, ...)
# stay out: adding features after seeing outcomes would break the pre-registration.
# The nipah first_column (ipSAE) was chosen AFTER seeing outcomes; the egfr
# first_column was chosen by reasoning only. Recorded in docs/design-notes.md.
version: 1
targets:
  nipah-glycoprotein-g:
    first_column: boltz2_ipsae
    features:
      - {name: boltz2_iptm}
      - {name: boltz2_ipsae}
      - {name: boltz2_min_ipsae}
      - {name: boltz2_plddt}
      - {name: shape_complimentarity_boltz2_binder_ss}
      - {name: esmfold_plddt}
      - {name: proteinmpnn_score, higher_is_better: false}
  egfr:
    first_column: esmfold_plddt
    features:
      - {name: esmfold_plddt}
      - {name: proteinmpnn_score, higher_is_better: false}
  # The stop-game targets (kind: stop in games.yaml). Entries added 2026-10-13 for
  # the T20 ladder: chosen by column availability alone, outcomes NOT consulted.
  # All eight share first_column esmfold_plddt (full coverage everywhere, the same
  # reasoning-only rule as egfr). Only human-serum-albumin has boltz2 columns
  # (coverage 0.98), so only it gets the full nipah-style list; the others have
  # only esmfold_plddt and proteinmpnn_score (coverage 1.0, boltz2 coverage 0).
  human-serum-albumin:
    first_column: esmfold_plddt
    features:
      - {name: boltz2_iptm}
      - {name: boltz2_ipsae}
      - {name: boltz2_min_ipsae}
      - {name: boltz2_plddt}
      - {name: shape_complimentarity_boltz2_binder_ss}
      - {name: esmfold_plddt}
      - {name: proteinmpnn_score, higher_is_better: false}
  # The Anthropic release (docs/prereg-anthropic.md section 3). Pre-registered by column
  # availability alone: these are the four Proteinbase feature columns that also exist in
  # the Anthropic release, under their Proteinbase names and their Proteinbase orientation
  # (all higher-is-better). proteinmpnn_score and the shape complementarity have no
  # counterpart there and are left out. Values are as published: within one target the
  # release's metrics are comparable, so nothing is rescaled (D7).
  # first_column follows N-dev's choice (the Boltz-2 ipSAE), which here exists only as the
  # min-direction variant. The ab- prefix keeps these targets distinct from the Proteinbase
  # targets of the same name, whose features differ.
  ab-nipah-g: &anthropic_features
    first_column: boltz2_min_ipsae
    features:
      - {name: boltz2_min_ipsae}
      - {name: boltz2_iptm}
      - {name: boltz2_plddt}
      - {name: esmfold_plddt}
  ab-egfr: *anthropic_features
  ab-bbf-14: *anthropic_features
  ab-rehearsal: *anthropic_features
  human-tnfa: &stop_game_features
    first_column: esmfold_plddt
    features:
      - {name: esmfold_plddt}
      - {name: proteinmpnn_score, higher_is_better: false}
  human-gm2a: *stop_game_features
  human-orm2: *stop_game_features
  human-rfk: *stop_game_features
  hnmt: *stop_game_features
  human-ambp: *stop_game_features
  human-idi2: *stop_game_features
