# Prices in USD per million tokens. `date` is the day you verified the entry;
# keep it and the source in sync with the numbers. The spend guard's projection
# (and the pilot gate) is only as good as this file.
# Zeros below mean "blind" -- a run will look free even if it is not.
version: 1
prices:
  deepseek-flash:                             # key = price_key in models.yaml; id confirmed by the smoke test 2026-10-28
    currency: USD
    date: "2026/10/28"                            # the day you checked the pricing page
    source: "https://api-docs.deepseek.com/quick_start/pricing"   # PEAK tariff -- off-peak is cheaper, so every spend figure is an upper bound
    input_per_mtok: 0.3                      # peak tariff from the page above, checked on `date`
    cached_input_per_mtok: 0.006
    output_per_mtok: 1.2

  mimo-v2.6-flash:
    currency: USD
    date: "2026/10/28"
    source: "https://mimo.mi.com/docs/en-US/price/pay-as-you-go"
    input_per_mtok: 0.14
    cached_input_per_mtok: 0.0028
    output_per_mtok: 0.28

  claude-opus-5-5:
    currency: USD
    date: "2026/10/29"
    # From the Claude API reference (models overview and prompt-caching pages): $4 in,
    # $20 out, cache reads $0.20, 5-minute cache writes 1.25x input. Confirm on
    # the pricing page before a paid run, then keep this note or replace the source.
    source: "https://platform.claude.com/docs/en/about-claude/pricing"
    input_per_mtok: 4.0
    cached_input_per_mtok: 0.20
    cache_write_per_mtok: 5.0
    output_per_mtok: 20.0

  claude-sonnet-5-5:
    currency: USD
    date: "2026/10/29"
    # From the Claude API reference (models overview and prompt-caching pages): $2 in,
    # $10 out, cache reads $0.20, 5-minute cache writes 1.25x input. Confirm on
    # the pricing page before a paid run, then keep this note or replace the source.
    source: "https://platform.claude.com/docs/en/about-claude/pricing"
    input_per_mtok: 2.0
    cached_input_per_mtok: 0.20
    cache_write_per_mtok: 2.5
    output_per_mtok: 10.0

  local-free:
    currency: USD
    date: "n/a"
    source: "a model you run yourself costs nothing per token"
    input_per_mtok: 0
    cached_input_per_mtok: 0
    output_per_mtok: 0
