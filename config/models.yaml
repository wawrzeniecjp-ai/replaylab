# Model configuration for the eval.
# Verified against replaylab.eval.models.load_models (stricter than the example:
# no unknown keys, no model/messages/tools in params).
#
# Before a paid run: check every value against the provider's documentation and
# confirm with `scripts/smoke_llm.py` (LLM_API_KEY / LLM_MODEL / LLM_BASE_URL),
# which reports whether reasoning pass-back is needed. Nothing here is guessed by
# the code: `params` is sent as given, and the key is read from the named env var.
version: 1
models:
  deepseek:
    # smoke test 2026-10-28 (run twice): tool call OK, follow-ups OK, passback
    # NOT needed. reasoning_content turns out to be a per-response coin flip:
    # run 1 returned none, run 2 (identical request) returned it -- thinking
    # mode can emit trivial reasoning. The eval records it whenever present
    # (records schema 2) and never passes it back. Ids: deepseek-flash,
    # deepseek-v4-pro. Thinking mode rejects tool_choice=required (400); the
    # eval never sends tool_choice, so nothing here needs to change.
    base_url: "https://api.deepseek.com"
    model: "deepseek-flash"                  # confirmed by the smoke test
    api_key_env: DEEPSEEK_API_KEY
    price_key: deepseek-flash                # entry in config/prices.yaml
    reasoning_passback: false                # smoke: "reasoning pass-back needed: no", field "none"
    reasoning_field: reasoning_content       # unused while passback is false
    params:
      # 4096 was too tight with thinking on (pilot peak 3471). 32768 is far under the
      # documented max output (384K, api-docs.deepseek.com pricing page, 2026-10-28);
      # a cut-off reply now fails the episode (ResponseTruncated), it is never recorded.
      max_tokens: 32768
      # temperature / seed / extra_body (a thinking switch): only what the smoke
      # test showed is accepted

  mimo:
    base_url: "https://api.xiaomimimo.com/v1"
    model: "mimo-v2.6-flash"
    api_key_env: MIMO_API_KEY
    price_key: mimo-v2.6-flash                # entry in config/prices.yaml
    reasoning_passback: false                 # smoke 2026-10-28: "reasoning pass-back needed: no" (field reasoning_content exists but is not required)
    reasoning_field: reasoning_content
    params:
      # The 4096 pilot (runs/mimo) hit the limit in 10/10 episodes, mid-reasoning.
      # Max output 131K per third-party listings (OpenRouter, DeepInfra); not found on
      # Xiaomi's own pages yet, so 32768 keeps well clear of it.
      max_tokens: 32768

  # Claude Opus 5.5 through the Anthropic Messages API (eval/llm_anthropic.py). Thinking is
  # always on for this model (a thinking budget or type "disabled" is a 400), so effort is
  # the only depth control: pinned here to the model's default, medium, so the setting is
  # in the config hash. display "summarized" returns readable thinking for the records (the
  # default is empty text). Signed thinking blocks are always passed back unchanged by the
  # adapter, so reasoning_passback does not apply. Top-level cache_control caches the
  # growing conversation; the pilot's spend.json shows whether reads happen.
  opus:
    api: anthropic
    base_url: "https://api.anthropic.com"
    model: "claude-opus-5-5"
    api_key_env: ANTHROPIC_API_KEY
    price_key: claude-opus-5-5
    params:
      max_tokens: 64000                       # model max output 128K; a cut-off reply fails the episode
      thinking: {type: adaptive, display: summarized}
      output_config: {effort: medium}
      cache_control: {type: ephemeral}

  # The local llama.cpp server (used by the recorded smoke run): free, so it is
  # the cheapest way to test the whole eval plumbing with no key at all.
  local-qwen:
    base_url: "http://127.0.0.1:8080/v1"
    model: "Qwen3-1.7B.Q4_K_M.gguf"
    api_key_env: LLM_API_KEY
    price_key: local-free
    reasoning_passback: false                 # smoke: "reasoning pass-back needed: no" (notes/week0/llm_smoke.txt)
    reasoning_field: reasoning_content
    params: {max_tokens: 2048}
