[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "replaylab"
version = "0.1.0"
description = "A decision engine for protein design selection, validated by replaying real outcomes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "scipy>=1.11",
    "scikit-learn>=1.8",  # l1_ratio alone selects the penalty from 1.8 (advisor.analysis)
    "pyyaml>=6",
    "pydantic>=2.7",
    "mcp>=2.3,<3",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://github.com/wawrzeniecjp-ai/replaylab"
Documentation = "https://wawrzeniecjp-ai.github.io/replaylab/"
Repository = "https://github.com/wawrzeniecjp-ai/replaylab"

[project.scripts]
replaylab = "replaylab.interfaces.cli:app"
replaylab-eval = "replaylab.eval.cli:app"

[project.optional-dependencies]
# openai and anthropic are only needed to actually *run* the eval: the adapters take an
# injected async client (AsyncOpenAI / AsyncAnthropic, or a fake), so the library and its
# tests never import them. Install with `uv sync --extra eval`.
eval = [
    "anthropic>=1.0",
    "openai>=3.37.0",
]
# documentation site: `uv sync --extra docs`, then `great-docs init` / `great-docs build`
# (great-docs also needs Quarto installed system-wide: https://quarto.org,
#  and the `d2` binary for diagrams: https://d2lang.com)
# Pinned to git main: D2 diagram support is documented but not yet in a PyPI
# release (0.17.0 lacks it). Switch back to "great-docs>=0.18" once released.
docs = ["great-docs @ git+https://github.com/posit-dev/great-docs"]

[dependency-groups]
# uv installs the default `dev` group on every `uv sync` / `uv run`, so a bare
# sync can never strip the test and lint tools again (an extras-based `dev` was
# silently removed by `uv sync`, which made `make test` fall back to the system
# pytest).
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"replaylab.eval" = ["*.html"]  # the replay viewer's page template

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
markers = [
    "data: needs data/processed built from the real Proteinbase CSV (local only)",
    "integration: spawns a subprocess or an MCP server",
    "llm: needs network and an API key, and spends money (never in CI)",
    "slow: takes more than 10 seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tool descriptions and agent-facing error messages are long sentences on purpose.
"src/replaylab/interfaces/tools/*.py" = ["E501"]
"src/replaylab/eval/cli.py" = ["E501"]  # usage examples in the module docstring
"tests/**" = ["E501"]  # data tables
